name: CI / Code Quality

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Import Check
        run: |
          python -m py_compile main.py ai_generator.py config.py database.py ozon_client.py poller.py handlers/*.py
          python -c "import main, database, ozon_client, ai_generator, poller; print('All modules imported cleanly!')"
